<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Vocab</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111111" />
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial; margin: 0; background:#0b0b0b; color:#f5f5f5; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px; }
    .card { background:#141414; border:1px solid #262626; border-radius:16px; padding:18px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    button, input[type="file"] {
      background:#1f1f1f; color:#f5f5f5; border:1px solid #2e2e2e; border-radius:12px;
      padding:10px 12px; font-size:16px;
    }
    button:active { transform: scale(0.99); }
    .big { font-size: 28px; line-height: 1.2; margin: 10px 0 0; }
    .muted { color:#bdbdbd; font-size: 14px; }
    .sep { height: 1px; background:#262626; margin: 14px 0; }
    .pill { display:inline-block; padding:6px 10px; border:1px solid #2e2e2e; border-radius:999px; font-size:13px; color:#cfcfcf; }
    .space { height: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content:space-between; align-items:center;">
      <div>
        <div class="pill">My Vocab • Offline</div>
        <div class="muted" id="stats">0 kart</div>
      </div>
      <div class="row">
        <button id="btnShuffle">Karıştır</button>
        <button id="btnReset">Sıfırla</button>
      </div>
    </div>

    <div class="space"></div>

    <div class="card">
      <div class="muted" id="modeLabel">Ön yüz: İngilizce</div>
      <div class="big" id="frontText">CSV içe aktar</div>
      <div class="sep"></div>
      <div class="muted" id="backLabel" style="display:none;">Arka yüz: Türkçe</div>
      <div class="big" id="backText" style="display:none;"></div>

      <div class="space"></div>
      <div class="row">
        <button id="btnFlip">Çevir</button>
        <button id="btnPrev">←</button>
        <button id="btnNext">→</button>
      </div>

      <div class="sep"></div>

      <div class="muted">Excel’den dışa aktar: CSV (UTF-8). Sütunlar: English, Turkish</div>
      <div class="row" style="margin-top:10px;">
        <input type="file" id="fileInput" accept=".csv,.txt" />
        <button id="btnExport">Dışa Aktar</button>
      </div>
    </div>

    <div class="space"></div>

    <div class="muted">
      iPhone’da “Paylaş → Ana Ekrana Ekle” ile uygulama gibi kullanırsın.
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
